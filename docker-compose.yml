services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - CSV_PATH=/app/data/Breast_Cancer-RECRUITING-phase2-625.csv
    volumes:
      # Mount the backend data dir so the trial CSV and embeddings cache are
      # both available inside the container. Read-write so the Voyage cache
      # can persist new chunks across restarts.
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    # nginx.conf proxies /api/ to ${BACKEND_URL}. The Dockerfile default of
    # http://localhost:8000 only works on Cloud Run (where the frontend and
    # backend share a hostname); in docker compose we reach the backend via
    # the service hostname on the compose network.
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
